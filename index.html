<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Bonalu 2026</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
background:radial-gradient(circle,#2b0000,#000);
font-family:Arial,sans-serif;
color:white;
}

h1{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:80px;
text-align:center;
color:gold;
text-shadow:0 0 20px gold;
z-index:10;
}

.photo{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
overflow:hidden;
border:5px solid gold;
box-shadow:0 0 25px gold;
animation:move 15s linear infinite;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

@keyframes move{
0%{
transform:translate(0,0);
}
25%{
transform:translate(400px,200px);
}
50%{
transform:translate(800px,-100px);
}
75%{
transform:translate(200px,300px);
}
100%{
transform:translate(0,0);
}
}

.flower{
position:absolute;
font-size:30px;
animation:fall linear infinite;
}

@keyframes fall{
from{
transform:translateY(-100px);
}
to{
transform:translateY(120vh);
}
}
</style>
</head>

<body>

<h1>
🌺 HAPPY BONALU 2026 🌺
<br>
<small style="font-size:30px">
May Goddess Mahankali Bless You
</small>
</h1>

<div class="photo" style="top:10%;left:5%;animation-duration:18s;">
<img src="myphoto.jpg">
</div>

<div class="photo" style="top:20%;right:10%;animation-duration:22s;">
<img src="myphoto.jpg">
</div>

<div class="photo" style="bottom:15%;left:15%;animation-duration:16s;">
<img src="myphoto.jpg">
</div>

<div class="photo" style="bottom:10%;right:20%;animation-duration:20s;">
<img src="myphoto.jpg">
</div>

<div class="photo" style="top:60%;left:40%;animation-duration:24s;">
<img src="myphoto.jpg">
</div>

<script>
for(let i=0;i<80;i++){
let flower=document.createElement("div");
flower.className="flower";
flower.innerHTML="🌸";
flower.style.left=Math.random()*100+"vw";
flower.style.animationDuration=(3+Math.random()*5)+"s";
flower.style.animationDelay=Math.random()*5+"s";
document.body.appendChild(flower);
}
</script>

</body>
</html>
